name: Live QCI
on:
  workflow_dispatch:
    inputs:
      devices:
        description: QCI devices authorized for the CI token
        type: choice
        default: dirac-3
        options:
          - dirac-3
          - dirac-1
          - dirac-1,dirac-3
permissions:
  contents: read
concurrency:
  group: live-qci
  cancel-in-progress: false
jobs:
  credentials:
    name: Check optional QCI credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.token.outputs.available }}
    steps:
      - name: Check QCI token
        id: token
        env:
          QCI_TOKEN: ${{ secrets.QCI_TOKEN }}
        run: |
          if [ -z "$QCI_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Live QCI tests skipped: the optional QCI_TOKEN secret is not configured. Offline CI does not require it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
  test:
    name: Julia 1 - ubuntu-latest - live QCI
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          QCI_TOKEN: ${{ secrets.QCI_TOKEN }}
          QCI_RUN_LIVE_TESTS: true
          QCI_LIVE_DEVICES: ${{ inputs.devices || 'dirac-3' }}
