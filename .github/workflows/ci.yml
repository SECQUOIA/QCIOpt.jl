name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
          - version: '1'
            os: ubuntu-latest
            arch: x64
          - version: '1.10'
            os: windows-latest
            arch: x64
          - version: '1'
            os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  coexistence:
    name: QCIOpt + DWave coexistence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Import QCIOpt and DWave with the default CondaPkg backend
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(mktempdir())
            Pkg.develop(path=pwd())
            Pkg.add(PackageSpec(
                url="https://github.com/JuliaQUBO/DWave.jl",
                rev="065b744147d86cb02aa28eb7ce4574544df5c7c9",
            ))
            include(joinpath(pwd(), "test", "dwave_coexistence.jl"))
          '
